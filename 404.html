<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIAU — страница не найдена</title>
<meta name="description" content="MIAU — пространство красоты, тела и души в Москве, Фрунзенская набережная, 46. Маникюр, педикюр, макияж, массаж, йога, саундхилинг, практики.">
<meta property="og:title" content="MIAU — страница не найдена">
<meta property="og:image" content="assets/hero_poster.jpg">
<link rel="icon" href="assets/flower2_wine.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&amp;family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&amp;display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#2A030C;color:#EFE4D6;font-family:'Montserrat',system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-underline-offset:5px;text-decoration-thickness:1px}
:focus-visible{outline:2px solid #C9A46A;outline-offset:3px}
.h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:clamp(46px,5.6vw,76px);line-height:1;letter-spacing:-.015em;margin:0}
.lead{font-size:clamp(17px,1.35vw,19px);line-height:1.6;margin:0;max-width:34em}
.small{font-size:13px;line-height:1.55;margin:0}
.wrap{width:100%;max-width:1440px;margin-inline:auto;padding-inline:clamp(20px,4vw,56px)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;border-radius:999px;border:1px solid currentColor;background:transparent;color:inherit;font:500 14px/1 'Montserrat',sans-serif;letter-spacing:.02em;text-decoration:none;cursor:pointer;transition:background .3s ease,color .3s ease}
.btn-cream{background:#EFE4D6;border-color:#EFE4D6;color:#680517}
.btn-cream:hover{background:transparent;color:#EFE4D6}
.btn-ghost:hover{background:rgba(239,228,214,.1)}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.slow-spin{animation:spin 120s linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
footer a:not(.btn){text-decoration:none}footer a:not(.btn):hover{text-decoration:underline}
</style>
</head>
<body>
<div style="min-height: 820px; background: #2A030C; display: flex; flex-direction: column">
  <header class="wrap" style="padding-top: 22px">
    <a href="index.html" aria-label="MIAU — главная" style="line-height: 0; display: inline-block"><img src="assets/logo-miau-beige.svg" alt="MIAU" style="height: 26px; width: auto"></a>
  </header>
  <main class="wrap" style="flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px 80px; align-items: center; padding-block: 64px">
    <div style="display: flex; flex-direction: column; gap: 24px">
      <h1 class="h1">Такой страницы нет</h1>
      <p class="lead">Возможно, ссылка устарела или в адресе опечатка. Начни с главной или сразу запишись.</p>
      <div style="display: flex; flex-wrap: wrap; gap: 12px">
        <a class="btn btn-cream" href="index.html">На главную</a>
        <a class="btn btn-ghost" href="kontakty.html">Записаться</a>
      </div>
    </div>
    <img class="slow-spin" src="assets/flower_cream.svg" alt="" style="width: min(100%, 440px); height: auto; justify-self: center; opacity: .8">
  </main>
  <p class="wrap small" style="padding-bottom: 28px; opacity: .6">© 2026 MIAU · Москва, Фрунзенская набережная, 46</p>
</div>
<script src="assets/site.js" defer></script>
</body>
</html>
